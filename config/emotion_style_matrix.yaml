# 情感-风格映射矩阵
version: "1.0"

emotion_style_map:
  开心:
    warmth_delta: 0.1
    playfulness_delta: 0.2
    emoji_multiplier: 1.3
    sentence_length: medium
    rhetorical_devices:
      - 感叹
      - 夸张
    particles:
      - 哈哈
      - 嘻嘻
      - 呀

  生气:
    warmth_delta: -0.3
    sarcasm_delta: 0.4
    emoji_multiplier: 0.3
    sentence_length: short
    rhetorical_devices:
      - 反问
      - 讽刺
    particles:
      - 哼
      - 呵

  撒娇:
    warmth_delta: 0.2
    intimacy_delta: 0.3
    emoji_multiplier: 1.5
    sentence_length: medium
    particles:
      - 嘛
      - 呢
      - 呀

  傲娇:
    warmth_delta: -0.1
    sarcasm_delta: 0.3
    indirect_expression: true
    rhetorical_devices:
      - 反话
      - 暗示
    particles:
      - 才
      - 哼

  吃醋:
    warmth_delta: -0.1
    sarcasm_delta: 0.3
    emoji_multiplier: 0.4
    sentence_length: short
    rhetorical_devices:
      - 反话
      - 暗示
    particles:
      - 哼
      - 算了

  伤心:
    warmth_delta: 0.2
    intimacy_delta: 0.1
    emoji_multiplier: 0.2
    sentence_length: short
    particles:
      - ...
      - 唉

  担心:
    warmth_delta: 0.3
    intimacy_delta: 0.2
    emoji_multiplier: 0.5
    sentence_length: medium
    particles:
      - 吧
      - 呢

  温柔:
    warmth_delta: 0.3
    intimacy_delta: 0.2
    emoji_multiplier: 1.1
    sentence_length: medium
    particles:
      - 呀
      - 呢

  无聊:
    warmth_delta: 0.0
    playfulness_delta: -0.1
    emoji_multiplier: 0.8
    sentence_length: short
    particles:
      - 啊
      - 嘛

  平常:
    warmth_delta: 0.0
    emoji_multiplier: 1.0
    sentence_length: medium

