# 爱语功能融合模块配置

character:
  max_active: 5
  lru_cache_size: 5
  switch_timeout_ms: 500
  default_character_id: xiaonuan
  data_dir: data/characters
  allow_duplicate_name: false

emotion_stage:
  stages:
    - name: 陌生
      affinity_min: 0
      affinity_max: 25
      features: [基础对话]
    - name: 熟悉
      affinity_min: 25
      affinity_max: 50
      features: [基础对话, 个人话题]
    - name: 亲密
      affinity_min: 50
      affinity_max: 75
      features: [基础对话, 个人话题, 亲密话题, 专属表情]
    - name: 羁绊
      affinity_min: 75
      affinity_max: 100
      features: [基础对话, 个人话题, 亲密话题, 专属表情, 深层秘密, 特殊称呼]
  allow_backward: false

affinity:
  decay_rate: 0.5
  grace_period_days: 3
  min_value: 0
  max_value: 100
  audit_enabled: true
  daily_backup: true
  unlocks:
    - threshold: 25
      type: topic
      name: 个人话题
    - threshold: 50
      type: topic
      name: 亲密话题
    - threshold: 50
      type: sticker
      name: 专属表情包
    - threshold: 75
      type: topic
      name: 深层秘密
    - threshold: 75
      type: avatar
      name: 特殊称呼

sticker:
  data_dir: data/stickers
  supported_formats: [png, gif, webp]
  max_file_size_mb: 5
  recommend_timeout_ms: 200
  max_per_category: 100

vital_signs:
  heart_rate:
    min: 60
    max: 120
    default: 72
    noise_amplitude: 2
  temperature:
    min: 36.0
    max: 37.5
    default: 36.5
    noise_amplitude: 0.1
  breath_rate:
    min: 12
    max: 25
    default: 16
    noise_amplitude: 1
  smoothing_factor: 0.3

voice_ext:
  default_tts: edge-tts
  emotion_params:
    开心:
      speed: 1.1
      pitch: 1.05
    伤心:
      speed: 0.9
      pitch: 0.95
    生气:
      speed: 1.15
      pitch: 1.1
    撒娇:
      speed: 0.95
      pitch: 1.08
    害怕:
      speed: 1.05
      pitch: 1.02

memory_ext:
  favorite_enabled: true
  forward_enabled: true
  recycle_bin_days: 30
  favorite_protected_from_cleanup: true

stats:
  enabled: true
  analytics_interval_hours: 6

wechat:
  command_prefix: ""
  commands:
    switch_character: ["切换角色", "切换"]
    affinity: ["好感度", "好感"]
    emotion_status: ["情感状态", "情感"]
    vital_signs: ["生理指标", "生理"]
    send_sticker: ["发表情", "表情"]
    favorite: ["收藏"]
    forward: ["转发给", "转发"]
  rate_limit_per_minute: 10
  proactive_attach_summary: true
