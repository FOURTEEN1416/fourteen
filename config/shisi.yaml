# 唯一的你 - 核心配置（shisi 域）
#
# 消费方：shisi/config.py::get_config
# 仅以下键被代码读取。其余历史键（app / character / conversation / emotion /
# websocket / security / performance / logging / features）从未被任何
# 代码读取，已于 2026-09-21 清除，见 docs/DELETION_LOG.md。

# 记忆系统配置（消费方：shisi/memory/legacy/memory_pipeline.py::_load_shisi_memory_config）
memory:
  # 工作记忆容量
  working_memory_capacity: 20
  # 短期记忆保留时间(小时)
  short_term_retention_hours: 24
  # 长期记忆触发阈值
  long_term_threshold: 5
  # 记忆相似度阈值
  similarity_threshold: 0.85
  # 是否启用记忆提取
  extraction_enabled: true

# 亲密度系统配置
# 消费方：shisi/affinity/enhancer.py、shisi/affinity/decay_engine.py、
#         shisi/affinity/unlock_manager.py
affinity:
  # 最大亲密度
  max_value: 100
  # 最小亲密度
  min_value: 0
  # 亲密度衰减系数
  decay_rate: 0.1
  # 解锁配置 - 好感度阈值对应的解锁内容
  unlocks:
    - threshold: 25
      type: "topic"
      name: "个人话题"
    - threshold: 50
      type: "topic"
      name: "亲密话题"
    - threshold: 50
      type: "sticker"
      name: "专属表情包"
    - threshold: 75
      type: "voice"
      name: "专属语音"
    - threshold: 90
      type: "special"
      name: "特殊互动"

# 语音扩展配置
# 消费方：shisi/voice/emotion_tts.py::VoiceEnhancer（default_tts / emotion_params）
voice:
  # 默认TTS引擎（与 system.yaml voice.engine 对齐，前端唯一 MiMo）
  default_tts: "mimo-tts"
  # 情感参数配置 - 影响语速和音调
  emotion_params:
    开心:
      speed: 1.1
      pitch: 1.1
      volume: 1.1
    撒娇:
      speed: 0.95
      pitch: 1.05
      volume: 1.05
    温柔:
      speed: 0.9
      pitch: 0.95
      volume: 0.95
    伤心:
      speed: 0.85
      pitch: 0.9
      volume: 0.9
    生气:
      speed: 1.15
      pitch: 1.15
      volume: 1.15
    害怕:
      speed: 1.1
      pitch: 0.95
      volume: 0.95
    害羞:
      speed: 0.92
      pitch: 0.9
      volume: 0.9
    傲娇:
      speed: 1.0
      pitch: 1.0
      volume: 1.0
    平常:
      speed: 1.0
      pitch: 1.0
      volume: 1.0
