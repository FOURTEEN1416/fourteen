env: test
# 测试环境：debug 可设为 true 便于调试
debug: true

llm:
  provider: deepseek
  primary_model: deepseek-chat
  temperature: 0.5
  max_tokens: 1024
  stream_enabled: false
  first_token_timeout: 5.0
  retry_count: 1
  opencode_zen_api_base: "https://opencode.ai/zen/v1"
  opencode_zen_default_model: "big-pickle"
  models_priority:
    - name: deepseek-chat
      priority: 1
  cache:
    enabled: false
    ttl: 3600
    redis:
      host: ${REDIS_HOST:-localhost}
      port: ${REDIS_PORT:-6379}
      db: 15
      password: ${REDIS_PASSWORD}

emotion:
  use_llm_classifier: false
  llm_classifier_timeout_ms: 500
  continuity_blend_ratio: 0.4

memory:
  working_memory_limit: 10
  episodic_archive_trigger_rounds: 5
  retrieval_timeout_seconds: 1.0

proactive:
  max_daily_messages: 3
  min_interval_minutes: 10
  urgency_threshold: 2.0
  use_llm_generation: false

safety:
  input_filter_enabled: true
  output_filter_enabled: true
  pii_anonymizer_enabled: false
  encryption_enabled: false
  prompt_injection_detection: true

tools:
  enabled: true
  execution_timeout_seconds: 5.0
  rate_limit_per_tool_per_minute: 10
  builtin_tools:
    - weather
    - search
    - calendar
    - calculator
    - time_awareness

api:
  host: "127.0.0.1"
  port: 18000
  websocket_port: 18765
  rate_limit_per_minute: 1000

observability:
  tracing_enabled: false
  metrics_enabled: false
  metrics_port: 19090
  health_check_enabled: true
  graceful_shutdown_timeout: 5.0
  log_level: DEBUG
  log_format: console

voice:
  enabled: false

sticker:
  enabled: false

character_card:
  enabled: false

memory_ext:
  enabled: false

fusion:
  orchestrator_mode: fast
