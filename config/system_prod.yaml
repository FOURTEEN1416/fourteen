env: prod
# 生产环境：debug 必须设为 false
debug: false

llm:
  provider: deepseek
  primary_model: deepseek-chat
  temperature: 0.7
  max_tokens: 2048
  stream_enabled: true
  first_token_timeout: 10.0
  retry_count: 3
  opencode_zen_api_base: "https://opencode.ai/zen/v1"
  opencode_zen_default_model: "big-pickle"
  models_priority:
    - name: deepseek-chat
      priority: 1
    - name: deepseek-reasoner
      priority: 2
  # 生产环境缓存配置
  cache:
    enabled: true
    ttl: 604800  # 7天 (秒)
    redis:
      host: ${REDIS_HOST:-localhost}
      port: ${REDIS_PORT:-6379}
      db: ${REDIS_DB:-0}
      password: ${REDIS_PASSWORD}

emotion:
  use_llm_classifier: true
  llm_classifier_timeout_ms: 1000
  continuity_blend_ratio: 0.4

memory:
  working_memory_limit: 20
  episodic_archive_trigger_rounds: 20
  retrieval_timeout_seconds: 2.0

proactive:
  max_daily_messages: 8
  min_interval_minutes: 60
  urgency_threshold: 2.0
  use_llm_generation: true

safety:
  input_filter_enabled: true
  output_filter_enabled: true
  pii_anonymizer_enabled: true
  encryption_enabled: true
  prompt_injection_detection: true

tools:
  enabled: true
  execution_timeout_seconds: 15.0
  rate_limit_per_tool_per_minute: 5
  builtin_tools:
    - weather
    - search
    - calendar
    - calculator
    - reminder
    - calendar_query
    - time_awareness
    - character_crawler

api:
  host: "0.0.0.0"
  port: 8000
  websocket_port: 8765
  rate_limit_per_minute: 30

observability:
  tracing_enabled: true
  metrics_enabled: true
  metrics_port: 9090
  health_check_enabled: true
  graceful_shutdown_timeout: 60.0
  log_level: WARNING
  log_format: json

# ── 语音合成配置 ──
voice:
  enabled: true
  audio_converter:
    ffmpeg_path: "ffmpeg"
    preferred_format: "silk"
    silk_sample_rate: 24000
  engine: "edge-tts"
  emotion_enabled: true
  edge-tts:
    speaker_name: "zh-CN-XiaoxiaoNeural"
    rate: "+0%"
    volume: "+0%"
    timeout: 30.0
  gpt-sovits:
    url: "http://localhost:9880"
    text_language: "auto"
    timeout: 60.0
  bert-vits2:
    url: "http://localhost:5000"
    speaker_name: "珊瑚宫心海[中]"
    sdp_ratio: 0.2
    noise: 0.2
    noisew: 0.9
    speed: 1.0
    timeout: 60.0

# ── 表情包配置 ──
sticker:
  enabled: true
  auto_recommend: true
  send_mode: "image_channel"
  emotion_mapping:
    "开心": ["开心", "可爱", "撒娇"]
    "伤心": ["伤心", "委屈"]
    "生气": ["生气", "傲娇"]
    "撒娇": ["撒娇", "可爱", "开心"]
    "害怕": ["害怕", "紧张"]
    "害羞": ["害羞", "可爱"]
    "默认": ["可爱"]
  send_delay_ms: 300

# ── 角色卡配置 ──
character_card:
  enabled: true
  default_card: ""
  card_dir: "config/characters"
  auto_load: true

# ── 长期记忆增强配置 ──
memory_ext:
  enabled: true
  collection_name: "long_term_memories"
  auto_extract: true

fusion:
  emotion:
    classifier_mode: hybrid
    blend_ratio: 0.4
    classifier_timeout_ms: 1000
  persona:
    prompt_mode: layered
    anchor_verification_enabled: true
  memory:
    forgetting_model: exponential
  ase:
    frequency_mode: adaptive
    generation_mode: llm
    reflection_mode: rule
  orchestrator_mode: full
  character_card:
    enabled: true
    mode: "merge"
  voice:
    enabled: true
  memory_ext:
    enabled: true
  persona_extractor:
    enabled: true
    mode: lite
    detect_frequency: 3
    inject_persona: true
