# 情感状态机配置
#
# 消费方：my_character/emotion_engine.py（EmotionEngine 把 emotion.decay 与
#         affection 两段提升为平铺参数表后逐键读取）
#
# 实际被读取的键：
#   energy_drain_per_message / energy_recovery_per_hour / intensity_per_minute
#   per_positive_reply / per_negative_reply / per_day_decay
#
# 其余历史段（emotion.initial / emotion.affinity_levels / emotion.style_influence /
# energy）从未被任何代码读取，已于 2026-09-21 清除，见 docs/DELETION_LOG.md。
# 注意：好感度阶梯阈值的权威来源是 config/shisi.yaml 的 affinity.unlocks，
# 不是本文件。

emotion:
  # 情感衰减参数
  decay:
    intensity_per_minute: 0.001     # 每分钟强度衰减
    energy_recovery_per_hour: 0.05  # 每小时能量恢复
    energy_drain_per_message: 0.02  # 每条消息消耗能量

affection:
  per_positive_reply: 1.0    # 积极回复增加好感
  per_negative_reply: -0.5   # 消极回复减少好感
  per_day_decay: 0.1         # 每天自然衰减
