env: dev
# WARNING: debug:true 仅用于开发环境，生产环境必须设为 false
debug: true

llm:
  byok_required: false              # BYOK 强制：非 admin 必须自带 API Key（开放给所有人时开启，成本自担）
  # ── 供应商模式 ──
  #   "auto"            → MultiProviderGateway（自动fallback链）
  #   "sensenova"       → 商汤日日新 SenseNova（glm-5.2 / deepseek-v4-flash）
  #   "zhipu"           → 仅智谱AI
  #   "xunfei"          → 仅讯飞星火
  #   "baidu"           → 仅百度千帆
  #   "deepseek"        → 仅DeepSeek
  provider: auto

  # ── Fallback 链（provider=auto 时生效）──
  # 按优先级依次尝试，前一个不可用自动切到下一个
  # 已配置 SENSENOVA_API_KEY 时，sensenova 作为首选强力模型
  fallback_chain:
    - sensenova     # 商汤日日新 glm-5.2（1M上下文，支持工具调用）
    - zhipu         # 智谱AI GLM-4.7-Flash（永久免费）
    - xunfei        # 讯飞星火 Spark Lite（永久免费）
    - baidu         # 百度千帆 ERNIE-Speed（每月50万免费Token）

  temperature: 0.85
  max_tokens: 2048
  stream_enabled: true
  first_token_timeout: 5.0
  retry_count: 3

  # ── 缓存配置 ──
  cache:
    enabled: true
    ttl: 604800  # 7天 (秒)
    redis:
      host: ${REDIS_HOST:-localhost}
      port: ${REDIS_PORT:-6379}
      db: ${REDIS_DB:-0}
      password: ${REDIS_PASSWORD}

emotion:
  use_llm_classifier: true
  llm_classifier_timeout_ms: 500
  continuity_blend_ratio: 0.4

memory:
  working_memory_limit: 20
  episodic_archive_trigger_rounds: 20
  retrieval_timeout_seconds: 3.0  # 覆盖 onnxruntime 模型冷启动 (~2-4s 首次加载)

proactive:
  max_daily_messages: 8
  min_interval_minutes: 30
  urgency_threshold: 2.0
  use_llm_generation: true

safety:
  input_filter_enabled: true
  output_filter_enabled: true
  pii_anonymizer_enabled: true
  encryption_enabled: true
  prompt_injection_detection: true

tools:
  enabled: true
  execution_timeout_seconds: 10.0
  rate_limit_per_tool_per_minute: 3
  builtin_tools:
    - weather
    - search
    - calendar
    - calculator
    - set_reminder
    - query_reminders
    - time_awareness
    - character_card

api:
  host: "127.0.0.1"
  port: 8000
  websocket_port: 8765
  rate_limit_per_minute: 60

observability:
  tracing_enabled: true
  metrics_enabled: true
  metrics_port: 9090
  health_check_enabled: true
  graceful_shutdown_timeout: 30.0
  log_level: INFO
  log_format: json

# ── 语音合成配置 ──
voice:
  enabled: true                         # 是否启用语音合成
  audio_converter:
    ffmpeg_path: "ffmpeg"
    preferred_format: "silk"
    silk_sample_rate: 24000
  asr:                                  # 语音转文字（OpenAI 兼容 /audio/transcriptions，08-28 补实）
    enabled: false                      # 启用后微信语音消息自动转文字进对话
    api_base: ""                        # 如 https://api.siliconflow.cn/v1
    api_key: "${ASR_API_KEY}"
    model: "FunAudioLLM/SenseVoiceSmall"
    language: "zh"
    timeout: 30.0
  engine: "mimo-tts"                   # 唯一引擎（2026-08-28 MiMo-only 收敛）
  emotion_enabled: true                 # 启用情感语音参数注入
  # MiMo TTS配置（优先API，本地引擎作为降级）
  # 文档: https://platform.xiaomimimo.com/docs
  mimo-tts:
    enabled: true                       # 是否启用MiMo TTS
    api_key: "${MIMO_API_KEY}"              # MiMo API密钥（仅从环境变量读取）
    base_url: "https://api.xiaomimimo.com/v1"  # MiMo TTS API Base URL（sk- 按量付费）
    model: "mimo-v2.5-tts"              # 默认模型:
                                        #   - mimo-v2.5-tts: 基础语音合成
                                        #   - mimo-v2.5-tts-voiceclone: 语音克隆
                                        #   - mimo-v2.5-tts-voicedesign: 音色设计
                                        #   - mimo-v2-tts: 降级备选
    voice_id: ""                        # 克隆音色ID（使用voiceclone时填写）
    timeout: 30.0                       # API调用超时（秒）
    fallback_local: true                # API失败时是否降级到本地引擎

# ── 表情包配置 ──
sticker:
  enabled: true
  auto_recommend: true
  send_mode: "image_channel"
  emotion_mapping:
    "开心": ["开心", "可爱", "撒娇"]
    "伤心": ["伤心", "委屈"]
    "生气": ["生气", "傲娇"]
    "撒娇": ["撒娇", "可爱", "开心"]
    "害怕": ["害怕", "紧张"]
    "害羞": ["害羞", "可爱"]
    "默认": ["可爱"]
  send_delay_ms: 300

# ── 角色卡配置 ──
character_card:
  enabled: true                         # 是否启用角色卡兼容
  default_card: ""                      # 默认角色卡路径 (空=不加载)
  card_dir: "config/characters"          # 角色卡扫描目录
  auto_load: true                        # 启动时自动加载默认角色卡

# ── 长期记忆增强配置 ──
memory_ext:
  enabled: true                         # 是否启用记忆增强（与 fusion.memory_ext.enabled 保持一致）
  collection_name: "long_term_memories"  # ChromaDB集合名
  auto_extract: true                     # 是否自动从对话提取记忆

fusion:
  emotion:
    classifier_mode: hybrid
    blend_ratio: 0.4
    classifier_timeout_ms: 500
  persona:
    prompt_mode: layered
    anchor_verification_enabled: true
  memory:
    forgetting_model: exponential
    # 是否使用 shisi 记忆服务适配层（双轨架构开关）
    # true  → 使用 shisi.application.memory_service.ShisiMemoryService
    # false → 使用 memory.memory_pipeline.MemoryPipeline（已废弃，默认 true）
    use_shisi_memory: true
  rag:
    # 是否使用 shisi knowledge 适配层（双轨架构开关）
    # true  → 使用 shisi.application.knowledge_service.ShisiKnowledgeAdapter
    # false → 使用 rag_engine.rag_engine.RAGEngineV2（已废弃，默认 true）
    use_shisi_rag: true
  ase:
    frequency_mode: adaptive
    generation_mode: llm
    reflection_mode: rule
  orchestrator_mode: fast               # full=12步流程, fast=精简流程
  # ── 新模块控制在fusion层 ──
  character_card:
    enabled: true
    mode: "merge"                        # merge=合并, replace=替换, append=追加
  voice:
    enabled: true
  memory_ext:
    enabled: true
  persona_extractor:
    enabled: true
    mode: lite
    detect_frequency: 3
    inject_persona: true
