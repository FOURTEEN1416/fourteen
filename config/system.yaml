env: dev
debug: true

llm:
  provider: deepseek
  primary_model: deepseek-chat
  temperature: 0.85
  max_tokens: 2048
  stream_enabled: true
  first_token_timeout: 5.0
  retry_count: 0
  models_priority:
    - name: deepseek-chat
      priority: 1
    - name: deepseek-reasoner
      priority: 2

emotion:
  use_llm_classifier: true
  llm_classifier_timeout_ms: 500
  continuity_blend_ratio: 0.4

memory:
  working_memory_limit: 20
  episodic_archive_trigger_rounds: 20
  retrieval_timeout_seconds: 1.0

proactive:
  max_daily_messages: 8
  min_interval_minutes: 30
  urgency_threshold: 2.0
  use_llm_generation: true

safety:
  input_filter_enabled: true
  output_filter_enabled: true
  pii_anonymizer_enabled: true
  encryption_enabled: false
  prompt_injection_detection: true

tools:
  enabled: true
  execution_timeout_seconds: 10.0
  rate_limit_per_tool_per_minute: 3
  builtin_tools:
    - weather
    - search
    - calendar
    - calculator
    - reminder
    - calendar_query
    - time_awareness
    - character_crawler

api:
  host: "0.0.0.0"
  port: 8000
  websocket_port: 8765
  rate_limit_per_minute: 60

observability:
  tracing_enabled: true
  metrics_enabled: true
  metrics_port: 9090
  health_check_enabled: true
  graceful_shutdown_timeout: 30.0
  log_level: INFO
  log_format: json

# ── 语音合成配置 ──
voice:
  enabled: false                        # 是否启用语音合成
  engine: "edge-tts"                    # 默认引擎: edge-tts / gpt-sovits / bert-vits2
  emotion_enabled: true                 # 启用情感语音参数注入
  edge-tts:
    speaker_name: "zh-CN-XiaoxiaoNeural" # 中文女声
    rate: "+0%"
    volume: "+0%"
    timeout: 30.0
  gpt-sovits:
    url: "http://localhost:9880"
    text_language: "auto"
    timeout: 60.0
  bert-vits2:
    url: "http://localhost:5000"
    speaker_name: "珊瑚宫心海[中]"
    sdp_ratio: 0.2
    noise: 0.2
    noisew: 0.9
    speed: 1.0
    timeout: 60.0

# ── 表情包配置 ──
sticker:
  enabled: true
  auto_recommend: true
  send_mode: "image_channel"
  emotion_mapping:
    "开心": ["开心", "可爱", "撒娇"]
    "伤心": ["伤心", "委屈"]
    "生气": ["生气", "傲娇"]
    "撒娇": ["撒娇", "可爱", "开心"]
    "害怕": ["害怕", "紧张"]
    "害羞": ["害羞", "可爱"]
    "默认": ["可爱"]
  send_delay_ms: 300

# ── 角色卡配置 ──
character_card:
  enabled: true                         # 是否启用角色卡兼容
  default_card: ""                      # 默认角色卡路径 (空=不加载)
  card_dir: "config/characters"          # 角色卡扫描目录
  auto_load: true                        # 启动时自动加载默认角色卡

# ── 长期记忆增强配置 ──
memory_ext:
  enabled: false                        # 是否启用记忆增强
  collection_name: "long_term_memories"  # ChromaDB集合名
  auto_extract: true                     # 是否自动从对话提取记忆

fusion:
  emotion:
    classifier_mode: hybrid
    blend_ratio: 0.4
    classifier_timeout_ms: 500
  persona:
    prompt_mode: layered
    anchor_verification_enabled: true
  memory:
    forgetting_model: exponential
  ase:
    frequency_mode: adaptive
    generation_mode: llm
    reflection_mode: rule
  orchestrator_mode: fast               # full=12步流程, fast=精简流程
  # ── 新模块控制在fusion层 ──
  character_card:
    enabled: true
    mode: "merge"                        # merge=合并, replace=替换, append=追加
  voice:
    enabled: true
  memory_ext:
    enabled: true
  persona_extractor:
    enabled: true
    mode: lite
    detect_frequency: 3
    inject_persona: true
