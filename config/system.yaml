env: dev
# WARNING: debug:true 仅用于开发环境，生产环境必须设为 false
debug: true

llm:
  # ── 供应商模式 ──
  #   "auto"            → MultiProviderGateway（自动fallback链）
  #   "zhipu"           → 仅智谱AI
  #   "xunfei"          → 仅讯飞星火
  #   "baidu"           → 仅百度千帆
  #   "deepseek"        → 仅DeepSeek
  #   "opencode_zen"    → 仅OpenCode Zen免费模型
  provider: auto

  # ── Fallback 链（provider=auto 时生效）──
  # 按优先级依次尝试，前一个不可用自动切到下一个
  # 用户可在 .env 中配置 DEEPSEEK_API_KEY 后，将 deepseek 插入链首
  fallback_chain:
    - zhipu         # 智谱AI GLM-4.7-Flash（永久免费）
    - xunfei        # 讯飞星火 Spark Lite（永久免费）
    - baidu         # 百度千帆 ERNIE-Speed（每月50万免费Token）
    - opencode_zen  # OpenCode Zen 免费模型（无需API Key，兜底）

  temperature: 0.85
  max_tokens: 2048
  stream_enabled: true
  first_token_timeout: 5.0
  retry_count: 3

  # ── 缓存配置 ──
  cache:
    enabled: true
    ttl: 604800  # 7天 (秒)
    redis:
      host: ${REDIS_HOST:-localhost}
      port: ${REDIS_PORT:-6379}
      db: ${REDIS_DB:-0}
      password: ${REDIS_PASSWORD}

emotion:
  use_llm_classifier: true
  llm_classifier_timeout_ms: 500
  continuity_blend_ratio: 0.4

memory:
  working_memory_limit: 20
  episodic_archive_trigger_rounds: 20
  retrieval_timeout_seconds: 3.0  # 覆盖 onnxruntime 模型冷启动 (~2-4s 首次加载)

proactive:
  max_daily_messages: 8
  min_interval_minutes: 30
  urgency_threshold: 2.0
  use_llm_generation: true

safety:
  input_filter_enabled: true
  output_filter_enabled: true
  pii_anonymizer_enabled: true
  encryption_enabled: false
  prompt_injection_detection: true

tools:
  enabled: true
  execution_timeout_seconds: 10.0
  rate_limit_per_tool_per_minute: 3
  builtin_tools:
    - weather
    - search
    - calendar
    - calculator
    - reminder
    - calendar_query
    - time_awareness
    - character_crawler

api:
  host: "0.0.0.0"
  port: 8000
  websocket_port: 8765
  rate_limit_per_minute: 60

observability:
  tracing_enabled: true
  metrics_enabled: true
  metrics_port: 9090
  health_check_enabled: true
  graceful_shutdown_timeout: 30.0
  log_level: INFO
  log_format: json

# ── 语音合成配置 ──
voice:
  enabled: true                         # 是否启用语音合成
  audio_converter:
    ffmpeg_path: "ffmpeg"
    preferred_format: "silk"
    silk_sample_rate: 24000
  engine: "mimo-tts"                   # 默认引擎: mimo-tts / edge-tts / cosyvoice / gpt-sovits / bert-vits2
  emotion_enabled: true                 # 启用情感语音参数注入
  edge-tts:
    speaker_name: "zh-CN-XiaoxiaoNeural" # 中文女声
    rate: "+0%"
    volume: "+0%"
    timeout: 30.0
  cosyvoice:
    voice: "中文女"
    instruct_prompt: "用温柔自然的语气说话"
    timeout: 120.0
  gpt-sovits:
    url: "http://localhost:9880"
    text_language: "auto"
    timeout: 60.0
  bert-vits2:
    url: "http://localhost:5000"
    speaker_name: "珊瑚宫心海[中]"
    sdp_ratio: 0.2
    noise: 0.2
    noisew: 0.9
    speed: 1.0
    timeout: 60.0
  # MiMo TTS配置（优先API，本地引擎作为降级）
  # 文档: https://platform.xiaomimimo.com/docs
  mimo-tts:
    enabled: true                       # 是否启用MiMo TTS
    api_key: "sk-c3xwgfb34tyvbs3h14iji0gbruvwim1fi4siglxel6fdl3y8"  # MiMo API密钥
    model: "mimo-v2.5-tts"              # 默认模型:
                                        #   - mimo-v2.5-tts: 基础语音合成
                                        #   - mimo-v2.5-tts-voiceclone: 语音克隆
                                        #   - mimo-v2.5-tts-voicedesign: 音色设计
                                        #   - mimo-v2-tts: 降级备选
    voice_id: ""                        # 克隆音色ID（使用voiceclone时填写）
    timeout: 30.0                       # API调用超时（秒）
    fallback_local: true                # API失败时是否降级到本地引擎

# ── 表情包配置 ──
sticker:
  enabled: true
  auto_recommend: true
  send_mode: "image_channel"
  emotion_mapping:
    "开心": ["开心", "可爱", "撒娇"]
    "伤心": ["伤心", "委屈"]
    "生气": ["生气", "傲娇"]
    "撒娇": ["撒娇", "可爱", "开心"]
    "害怕": ["害怕", "紧张"]
    "害羞": ["害羞", "可爱"]
    "默认": ["可爱"]
  send_delay_ms: 300

# ── 角色卡配置 ──
character_card:
  enabled: true                         # 是否启用角色卡兼容
  default_card: ""                      # 默认角色卡路径 (空=不加载)
  card_dir: "config/characters"          # 角色卡扫描目录
  auto_load: true                        # 启动时自动加载默认角色卡

# ── 长期记忆增强配置 ──
memory_ext:
  enabled: true                         # 是否启用记忆增强（与 fusion.memory_ext.enabled 保持一致）
  collection_name: "long_term_memories"  # ChromaDB集合名
  auto_extract: true                     # 是否自动从对话提取记忆

fusion:
  emotion:
    classifier_mode: hybrid
    blend_ratio: 0.4
    classifier_timeout_ms: 500
  persona:
    prompt_mode: layered
    anchor_verification_enabled: true
  memory:
    forgetting_model: exponential
    # 是否使用 shisi 记忆服务适配层（双轨架构开关）
    # true  → 使用 shisi.application.memory_service.ShisiMemoryService
    # false → 使用 memory.memory_pipeline.MemoryPipeline（默认，保持兼容）
    use_shisi_memory: false
  ase:
    frequency_mode: adaptive
    generation_mode: llm
    reflection_mode: rule
  orchestrator_mode: fast               # full=12步流程, fast=精简流程
  # ── 新模块控制在fusion层 ──
  character_card:
    enabled: true
    mode: "merge"                        # merge=合并, replace=替换, append=追加
  voice:
    enabled: true
  memory_ext:
    enabled: true
  persona_extractor:
    enabled: true
    mode: lite
    detect_frequency: 3
    inject_persona: true
