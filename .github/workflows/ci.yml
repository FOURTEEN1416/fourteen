name: CI

on:
  push:
    branches: [main, arch/*]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 8 * * 1'  # 每周一 08:00 UTC 周期检查

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: "Run pytest (push/PR: stop on first fail)"
        if: github.event_name != 'schedule'
        run: pytest -v --tb=short -x
        env:
          ENV: test
          AI_GF_ENV: test

      - name: "Run pytest with coverage (schedule: full report)"
        if: github.event_name == 'schedule'
        run: pytest -v --tb=short --cov=. --cov-report=term --cov-report=html -m "not slow"
        env:
          ENV: test
          AI_GF_ENV: test

      - name: Upload coverage report (schedule only)
        if: github.event_name == 'schedule'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: htmlcov/

      - name: Run ruff check (Hardened)
        run: ruff check . --output-format=github
        # continue-on-error: true  <-- Removed: FF-020 now requires strict pass

      - name: Run mypy check (Hardened)
        run: mypy . --ignore-missing-imports --no-error-summary
        # continue-on-error: true  <-- Removed: FF-020 now requires strict pass

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - name: Setup bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install frontend dependencies
        run: bun install

      - name: TypeScript type check (Hardened)
        run: bunx tsc --noEmit
        # continue-on-error: true  <-- Removed: FF-022 now requires strict pass

      - name: Build frontend
        run: bun run build

      - name: Run vitest (New)
        run: bun run test

      - name: Install Playwright browsers
        run: bunx playwright install chromium

      - name: Setup backend for E2E (seed DB + start uvicorn)
        working-directory: .
        run: |
          pip install -e .
          python scripts/e2e_setup.py
          nohup env APP_DATABASE_URL="sqlite+aiosqlite:///data/e2e_users.db" API_KEY_ENABLED=false             python -m uvicorn api.run_api:app --host 127.0.0.1 --port 8000 > uvicorn.log 2>&1 &
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:8000/api/health > /dev/null && break
            sleep 2
          done
          curl -sf http://127.0.0.1:8000/api/health > /dev/null || (cat uvicorn.log && exit 1)

      - name: Run Playwright E2E (New)
        env:
          E2E_ADMIN: e2e-admin@test.local
          E2E_PASSWORD: E2eTest#2026
        # Uses the webServer defined in playwright.config.ts (frontend dev + proxy to :8000)
        run: bunx playwright test

  weekly-hygiene:
    # 新增 job：专门跑 Lint / Type / E2E（独立于 push 触发的快速反馈）
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule'
    needs: [backend, frontend]
    steps:
      - name: Summary
        run: echo "✅ Weekly hygiene passed (Lint/Type/E2E integrated in main jobs)"

  # ═══ Fitness Functions（自动化门禁） ═══

  ff-no-old-api-imports:
    # FF-0003: 前端页面禁止直接 import 旧 API 文件
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check pages/ 无旧 API import
        run: |
          FORBIDDEN="from.*'\.\./api/characterApi\|from.*'\.\./api/memoryApi\|from.*'\.\./api/personaCardApi\|from.*'\.\./api/voiceApi\|from.*'\.\./api/oldClient\|from.*shisiClient\|from.*trainingApi"
          if grep -rn "$FORBIDDEN" frontend/src/pages/ frontend/src/hooks/ 2>/dev/null; then
            echo "❌ FF-0003 违规：页面直接 import 了旧 API 文件"
            exit 1
          fi
          echo "✅ FF-0003: 无旧 API import"

  ff-client-ts-no-functions:
    # FF-0006: client.ts 禁止定义函数（只做 re-export）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check client.ts 无函数定义
        run: |
          if grep -qE "export (async )?function|export const.*=.*\(.*\)" frontend/src/api/client.ts 2>/dev/null; then
            echo "❌ FF-0006 违规：client.ts 包含函数定义，应移到领域文件中"
            exit 1
          fi
          echo "✅ FF-0006: client.ts 纯 re-export"

  ff-stores-no-api-imports:
    # FF-0007: Zustand store 禁止直接调用 API
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check stores/ 无 API import
        run: |
          if grep -rn "from.*\.\./api/" frontend/src/store/*.ts 2>/dev/null; then
            echo "❌ FF-0007 违规：Zustand store 直接 import API"
            exit 1
          fi
          echo "✅ FF-0007: Store 无 API 直接调用"

  ff-auth-endpoints:
    # FF-014: 认证模块端点完整性检查
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check auth_routes.py exports router with 5 endpoints
        run: |
          FILE="api/routers/auth_routes.py"
          if [ ! -f "$FILE" ]; then
            echo "❌ FF-014 违规：auth_routes.py 不存在"
            exit 1
          fi
          if ! grep -q "router = APIRouter" "$FILE"; then
            echo "❌ FF-014 违规：auth_routes.py 未导出 router"
            exit 1
          fi
          for ENDPOINT in register login refresh logout me; do
            if ! grep -q "async def $ENDPOINT" "$FILE"; then
              echo "❌ FF-014 违规：缺少端点 $ENDPOINT"
              exit 1
            fi
          done
          echo "✅ FF-014: auth_routes.py 完整（5端点: register/login/refresh/logout/me）"

  ff-route-guard:
    # FF-015: 前端路由守卫覆盖检查
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check App.tsx has ProtectedLayout with AuthGuard
        run: |
          FILE="frontend/src/App.tsx"
          if [ ! -f "$FILE" ]; then
            echo "❌ FF-015 违规：App.tsx 不存在"
            exit 1
          fi
          if ! grep -q "function ProtectedLayout" "$FILE"; then
            echo "❌ FF-015 违规：缺少 ProtectedLayout 组件"
            exit 1
          fi
          if ! grep -q "<AuthGuard>" "$FILE"; then
            echo "❌ FF-015 违规：ProtectedLayout 未使用 AuthGuard"
            exit 1
          fi
          if ! grep -q 'path="/login"' "$FILE"; then
            echo "❌ FF-015 违规：缺少 /login 路由"
            exit 1
          fi
          echo "✅ FF-015: 路由守卫覆盖完整（ProtectedLayout + AuthGuard + /login）"

  ff-sub-router-mount:
    # FF-016/017: 8 子路由 mount 完整性 + main_routes.py 端点零残留
    # 跑 tests/test_api_routes.py 的 14 个用例：8 子路由 parametrize + 3 单测 + 2 live HTTP 烟测
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: "FF-016/017: 8 子路由 mount + main_routes 零端点"
        run: pytest tests/test_api_routes.py -v --tb=short
        env:
          ENV: test
          AI_GF_ENV: test

  adr-integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check ADR directory exists and not empty
        run: |
          if [ ! -d "docs/adr" ] || [ -z "$(ls -A docs/adr)" ]; then
            echo "❌ docs/adr/ 目录为空或不存在"
            exit 1
          fi
          echo "✅ docs/adr/ 存在且有 ADR 文件"

      - name: Check ADR Supersedes links are valid
        run: |
          for file in docs/adr/*.md; do
            supersedes=$(grep -oP 'Supersedes ADR-\K\d+' "$file" || true)
            if [ -n "$supersedes" ] && [ ! -f "docs/adr/ADR-$supersedes-*.md" ]; then
              echo "⚠️  $file 引用了 ADR-$supersedes，但找不到完全匹配的文件名"
            fi
          done
          echo "✅ ADR 引用完整性检查完成"
