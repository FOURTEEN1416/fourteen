# ═══════════════════════════════════════════════════════════════════
# pre-commit — 本地门禁（把 CI 的判分提前到提交时）
#
# 生效方式： pre-commit install          # 不装则本文件完全无作用，提交不被阻塞
# 手动全量： pre-commit run --all-files
# 跳过单次： git commit --no-verify      # CI 仍是唯一权威，钩子只做提前拦截
#
# ⚠️ 版本一致性铁律：下方 ruff-pre-commit 的 rev 必须与 pyproject.toml 的
#    ruff 约束同源（当前 0.16.8）。改一处必须同步另一处，否则又是一处漂移源。
# ═══════════════════════════════════════════════════════════════════
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.8
    hooks:
      # 只启用 check（与 CI 一致）。CI 未跑 ruff format，故此处亦不启用，
      # 避免引入 CI 不校验的格式化要求。
      # 注意：hook id 是 ruff-check；`ruff` 为 legacy alias，会打印 "legacy alias" 提示。
      - id: ruff-check

  - repo: local
    hooks:
      # 并发 index 门禁（2026-09-22 W1 事故驱动）分两层：
      # ① 真拦截在**原生** .git/hooks/pre-commit 链（scripts/install_native_gate.py 注入，
      #    先于本框架执行——框架 autostash 会把工作树拉平到 index，分叉在框架内不可见，
      #    故门禁脚本不可作为本框架钩子接线，那是结构性失明）。
      # ② 本钩子只做**完整性自检**：原生链里门禁标记还在不在——他窗重跑
      #    `pre-commit install` 覆盖 .git/hooks/pre-commit 时，提交即被拒并给出重装指引，
      #    防止防护静默失踪（谎言家族：装过≠还在）。
      - id: native-gate-installed
        name: native gate hook intact (staged-vs-worktree guard chain)
        entry: python scripts/gate_native_hook_installed.py
        language: system
        pass_filenames: false
        always_run: true

      # CI 的 ff-* / adr-integrity 门禁的单一真源：
      # 本地直接调用 CI 用的同一份脚本，口径逐字一致。
      # 脚本仅依赖标准库（任意 Python 3.10+ 均可），故 language: system 安全。
      - id: ci-gates
        name: CI gates (FF-0003 / FF-0006 / FF-0007 / ADR)
        entry: python scripts/ci_gates.py
        language: system
        pass_filenames: false
        always_run: true
