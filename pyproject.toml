[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-girlfriend"
version = "3.0.0"
description = "十四 AI虚拟伴侣系统 - 基于LLM的智能情感陪伴与记忆增强系统"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "十四团队", email = "team@shisi.ai"}
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.27.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.1.0",
    "sqlalchemy>=2.0.0",
    "aiosqlite>=0.19.0",
    "chromadb>=0.4.0",
    "sentence-transformers>=2.3.0",
    "numpy>=1.24.0",
    "aiohttp>=3.9.0",
    "websockets>=12.0",
    "python-multipart>=0.0.9",
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    "httpx>=0.26.0",
    "tenacity>=8.2.0",
    "prometheus-client>=0.19.0",
    "opentelemetry-api>=1.22.0",
    "opentelemetry-sdk>=1.22.0",
    "opentelemetry-instrumentation-fastapi>=0.43b0",
    "pyyaml>=6.0.1",
    "python-dotenv>=1.0.0",
    "schedule>=1.2.0",
    "jieba>=0.42.1",
    "openpyxl>=3.1.2",
    "pandas>=2.2.0",
    "requests>=2.31.0",
    "beautifulsoup4>=4.12.0",
    "lxml>=5.1.0",
    "pillow>=10.2.0",
    "psutil>=5.9.0",
    # 以下依赖来自 requirements.txt，统一整合
    "APScheduler>=3.10.0",
    "pycryptodome>=3.19",
    "zstandard>=0.22",
    "rank-bm25>=0.2.2",
    "duckduckgo-search>=6.0.0",
    "chinese-calendar>=1.9.0",
    "lunarcalendar>=0.2.0",
    "edge-tts>=6.1.0",
    "trafilatura>=1.6.0",
    "watchfiles>=0.21.0",
    "redis>=5.0.0",
    "slowapi>=0.1.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",
    "pytest-mock>=3.12.0",
    "mypy>=1.8.0",
    "pre-commit>=3.6.0",
    # 使用 ruff 替代 black/isort/flake8
    "ruff>=0.3.0",
]

[project.scripts]
ai-girlfriend = "main:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["*"]
exclude = ["tests*", "frontend*", "docs*"]

[tool.black]
line-length = 100
target-version = ['py310', 'py311', 'py312']

[tool.isort]
profile = "black"
line_length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-v --tb=short"
pythonpath = ["."]

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM"]
ignore = ["E501", "C901"]

[tool.ruff.lint.per-file-ignores]
"tests/real_e2e_test.py" = ["E402"]
"tests/real_test.py" = ["E402"]
"tests/*" = ["S101", "S106", "ARG001", "PLR2004", "T201"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
