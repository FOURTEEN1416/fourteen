[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "unique-you"
version = "3.1.0"
description = "唯一的你 — 基于LLM的智能情感陪伴与记忆增强系统"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "Unique You Team", email = "team@unique-you.dev"}
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.27.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.1.0",
    "sqlalchemy>=2.0.0",
    "aiosqlite>=0.19.0",
    "chromadb>=0.4.0",
    "sentence-transformers>=2.3.0",
    "numpy>=1.24.0",
    "aiohttp>=3.9.0",
    "websockets>=17.0",
    "python-multipart>=0.0.9",
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    "httpx>=0.27.0",
    "tenacity>=8.2.0",
    "prometheus-client>=0.19.0",
    "opentelemetry-api>=1.22.0",
    "opentelemetry-sdk>=1.22.0",
    "opentelemetry-instrumentation-fastapi>=0.43b0",
    "pyyaml>=6.0.1",
    "python-dotenv>=1.0.0",
    "schedule>=1.2.0",
    "jieba>=0.42.1",
    "openpyxl>=3.1.2",
    "pandas>=2.2.0",
    "requests>=2.32.0",
    "beautifulsoup4>=4.12.0",
    "lxml>=5.1.0",
    "pillow>=10.3.0",
    "qrcode[pil]>=8.0",
    "psutil>=5.9.0",
    # 以下依赖来自 requirements.txt，统一整合
    "APScheduler>=3.10.0",
    "pycryptodome>=3.19",
    "zstandard>=0.22",
    "rank-bm25>=0.2.2",
    "duckduckgo-search>=6.0.0",
    "chinese-calendar>=1.9.0",
    "lunarcalendar>=0.0.7",
    "trafilatura>=1.6.0",
    "cloudscraper>=1.2.71",
    "watchfiles>=0.21.0",
    "redis>=5.0.0",
    "slowapi>=0.1.9",
    "sentry-sdk>=2.0.0",
    # 以下两项原仅存在于 requirements.txt，现统一并入 pyproject.toml（权威来源）
    "structlog>=24.0.0",        # 可观测性：结构化日志
    "cryptography>=42.0.0",     # 安全：加密原语（python-jose 已间接依赖，显式声明以保证版本）
]

[project.optional-dependencies]
# Windows 本地 TTS 兜底（MiMo 云故障时的 fallback_local，仅 win32）
win-tts-fallback = [
    "pywin32>=306; sys_platform == 'win32'",
]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",
    "pytest-mock>=3.12.0",
    "mypy>=1.8.0",
    "pre-commit>=3.6.0",
    # 使用 ruff 替代 black/isort/flake8
    "ruff>=0.3.0",
]

[project.scripts]
unique-you = "main:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["*"]
exclude = ["tests*", "frontend*", "docs*"]

[tool.black]
line-length = 100
target-version = ['py310', 'py311', 'py312']

[tool.isort]
profile = "black"
line_length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-v --tb=short"
pythonpath = ["."]
filterwarnings = [
    # lark 1.3.1 内部仍使用 sre_parse/sre_constants（Python 3.12 废弃），等上游修复后移除
    "ignore:module 'sre_parse' is deprecated:DeprecationWarning:lark",
    "ignore:module 'sre_constants' is deprecated:DeprecationWarning:lark",
    # websockets 14.0+ legacy API 已废弃，项目已迁移到 asyncio API
    "ignore:websockets.legacy is deprecated:DeprecationWarning",
]

[tool.ruff]
target-version = "py310"
line-length = 120
exclude = ["third_party"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM"]
ignore = ["E501", "C901"]

[tool.ruff.lint.per-file-ignores]
"tests/real_e2e_test.py" = ["E402"]
"tests/real_test.py" = ["E402"]
"tests/*" = ["S101", "S106", "ARG001", "PLR2004", "T201"]
# FastAPI 依赖注入在参数默认值中是框架的官方推荐写法，B008 是 false positive
"api/**/*.py" = ["B008"]
# scripts/ 是管理/迁移/验证工具，非生产代码路径
"scripts/**/*.py" = ["E402", "E401", "F401", "F541", "I001", "SIM115", "SIM117", "UP015", "W293"]
"tools/builtin/character_crawler_tool.py" = ["F401"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.12"
exclude = ["third_party/", "wechatmsg_src/", "scripts/"]
plugins = ["sqlalchemy.ext.mypy.plugin"]
warn_return_any = false
warn_unused_configs = true
warn_unused_ignores = false
disallow_untyped_defs = false
ignore_missing_imports = true
no_implicit_optional = true
disable_error_code = "import-untyped"
warn_redundant_casts = true
# 注意：曾在此处通过 [[tool.mypy.overrides]] 对多个项目模块
# (api.*、cache.*、llm_provider、main、observability.*、voice.*) 设置
# ignore_errors = true，这会掩盖真实的类型错误。已移除该配置；
# 第三方库缺少类型存根的情况由上方的 ignore_missing_imports = true 覆盖。
