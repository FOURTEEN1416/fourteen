<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>创建角色 · 方案 A 预览</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<script src="https://unpkg.com/lucide@latest"></script>
<style>
  :root {
    --macaron-pink: #F8B4D9; --macaron-pink-light: #FCE7F3; --macaron-pink-deep: #EC4899;
    --macaron-blue: #B4D9F8; --macaron-blue-light: #DBEAFE; --macaron-blue-deep: #3B82F6;
    --macaron-green: #B4F8D9; --macaron-green-light: #D1FAE5; --macaron-green-deep: #10B981;
  }
  body { font-family: 'Noto Sans SC', system-ui, sans-serif;
    background: linear-gradient(135deg, #FDF2F8 0%, #EFF6FF 33%, #ECFDF5 66%, #FDF2F8 100%);
    background-size: 400% 400%; animation: gradientShift 15s ease infinite; min-height: 100vh; color: #1F2937; }
  @keyframes gradientShift { 0%,100%{background-position:0% 50%} 50%{background-position:100% 50%} }
  .glass-card { background: rgba(255,255,255,0.32); backdrop-filter: blur(20px) saturate(160%); -webkit-backdrop-filter: blur(20px) saturate(160%); border: 1px solid rgba(255,255,255,0.28); box-shadow: 0 6px 24px rgba(0,0,0,0.04); }
  .glass-pink { background: rgba(252,231,243,0.35); backdrop-filter: blur(20px) saturate(160%); border: 1px solid rgba(248,180,217,0.25); }
  .glass-blue { background: rgba(219,234,254,0.35); backdrop-filter: blur(20px) saturate(160%); border: 1px solid rgba(180,217,248,0.25); }
  .glass-green { background: rgba(209,250,229,0.35); backdrop-filter: blur(20px) saturate(160%); border: 1px solid rgba(180,248,217,0.25); }
  .btn-macaron { background: linear-gradient(135deg, var(--macaron-pink), var(--macaron-blue), var(--macaron-green)); background-size: 200% 200%; color: white; transition: all 0.4s ease; animation: btnGradient 3s ease infinite; }
  .btn-macaron:hover { transform: translateY(-2px) scale(1.02); box-shadow: 0 12px 24px rgba(236,72,153,0.25); }
  @keyframes btnGradient { 0%,100%{background-position:0% 50%} 50%{background-position:100% 50%} }
  .tab-pink { background: linear-gradient(135deg, var(--macaron-pink), var(--macaron-pink-deep)); color: white; box-shadow: 0 4px 12px rgba(236,72,153,0.25); }
  .tab-blue { background: linear-gradient(135deg, var(--macaron-blue), var(--macaron-blue-deep)); color: white; box-shadow: 0 4px 12px rgba(59,130,246,0.25); }
  .tab-green { background: linear-gradient(135deg, var(--macaron-green), var(--macaron-green-deep)); color: white; box-shadow: 0 4px 12px rgba(16,185,129,0.25); }
  .input-macaron { background: rgba(255,255,255,0.28); border: 1px solid rgba(255,255,255,0.45); transition: all 0.2s; }
  .input-macaron:focus { background: rgba(255,255,255,0.45); border-color: var(--macaron-pink); box-shadow: 0 0 0 3px rgba(248,180,217,0.2); outline: none; }
  .tag-pink { background: rgba(248,180,217,0.2); color: var(--macaron-pink-deep); }
  .tag-blue { background: rgba(180,217,248,0.2); color: var(--macaron-blue-deep); }
  .tag-green { background: rgba(180,248,217,0.2); color: var(--macaron-green-deep); }
  .message-user { background: linear-gradient(135deg, var(--macaron-pink), var(--macaron-pink-deep)); color: white; border-radius: 16px 16px 4px 16px; }
  .message-ai { background: rgba(255,255,255,0.38); backdrop-filter: blur(16px); border: 1px solid rgba(255,255,255,0.32); border-radius: 16px 16px 16px 4px; }
  .preset-card { background: rgba(255,255,255,0.45); border: 1px solid rgba(255,255,255,0.4); transition: all 0.3s; }
  .preset-card:hover { transform: translateY(-3px); background: rgba(255,255,255,0.7); }
  .preset-card.selected { border-color: var(--macaron-blue); background: rgba(219,234,254,0.4); }
  .preset-pill { background: rgba(255,255,255,0.25); border: 1px solid rgba(255,255,255,0.4); border-radius: 999px; padding: 0.35rem 0.9rem; font-size: 0.8rem; transition: all 0.2s; white-space: nowrap; color: #4B5563; }
  .preset-pill:hover { background: rgba(255,255,255,0.5); }
  .preset-pill.selected { background: rgba(255,255,255,0.75); border-color: var(--macaron-pink); color: var(--macaron-pink-deep); box-shadow: 0 2px 8px rgba(248,180,217,0.15); }
</style>
</head>
<body class="p-4 sm:p-6 lg:p-8">

<div class="max-w-6xl mx-auto space-y-5">
  <!-- Header -->
  <div>
    <div class="flex items-center gap-2 mb-1">
      <i data-lucide="sparkles" class="w-5 h-5 text-pink-500"></i>
      <h1 class="text-lg font-bold text-gray-800">创建角色</h1>
    </div>
    <p class="text-sm text-gray-400">选择一种方式来构建你的 AI 角色</p>
  </div>

  <!-- Presets -->
  <div class="flex items-center gap-2 text-sm flex-wrap">
    <span class="text-gray-400">或从预设开始：</span>
    <button class="preset-pill selected">十四 · 默认</button>
    <button class="preset-pill">孙颖莎</button>
    <button class="preset-pill">猫系室友</button>
    <button class="preset-pill">深夜电台</button>
    <button class="preset-pill">学习搭子</button>
  </div>

  <!-- Method selector -->
  <div class="glass-card rounded-2xl p-1.5 flex">
    <button class="flex-1 rounded-xl py-2.5 text-sm font-medium tab-pink transition-all">AI 对话</button>
    <button class="flex-1 rounded-xl py-2.5 text-sm font-medium text-gray-500 hover:text-gray-700 hover:bg-white/40 transition-all">克隆好友</button>
    <button class="flex-1 rounded-xl py-2.5 text-sm font-medium text-gray-500 hover:text-gray-700 hover:bg-white/40 transition-all">文件导入</button>
  </div>

  <!-- Main workspace -->
  <div class="glass-card rounded-2xl overflow-hidden grid grid-cols-1 lg:grid-cols-[2fr_1fr]">
    <!-- Left: AI chat -->
    <div class="p-5 border-b lg:border-b-0 lg:border-r border-white/40 flex flex-col min-h-[420px]">
      <div class="flex items-center gap-2 mb-4">
        <i data-lucide="message-square" class="w-4 h-4 text-pink-500"></i>
        <h3 class="text-sm font-semibold text-gray-700">和十四聊一会儿</h3>
        <span class="text-[10px] text-gray-400 ml-auto">通过对话让 AI 学习你的期待</span>
      </div>

      <div class="flex-1 space-y-4 overflow-y-auto pr-1 mb-4">
        <div class="flex gap-3">
          <div class="w-8 h-8 rounded-full btn-macaron flex items-center justify-center text-white text-xs font-bold shrink-0">你</div>
          <div class="message-ai px-4 py-2.5 text-sm text-gray-700 max-w-[80%]">
            我想让你成为一个安静、会听我说话的角色。
          </div>
        </div>
        <div class="flex gap-3 flex-row-reverse">
          <div class="w-8 h-8 rounded-full glass-blue flex items-center justify-center text-blue-600 text-xs font-bold shrink-0">我</div>
          <div class="message-user px-4 py-2.5 text-sm max-w-[80%]">
            好。我会安静地在。你说，我听。
          </div>
        </div>
      </div>

      <div class="flex items-end gap-3">
        <textarea rows="1" placeholder="说点什么…" class="input-macaron flex-1 rounded-xl px-4 py-2.5 text-sm resize-none" style="min-height:44px"></textarea>
        <button class="w-10 h-10 rounded-xl btn-macaron text-white flex items-center justify-center shrink-0">
          <i data-lucide="send" class="w-4 h-4"></i>
        </button>
      </div>
    </div>

    <!-- Right: live preview -->
    <div class="bg-white/30 backdrop-blur-sm p-5">
      <div class="flex items-center gap-2 mb-4">
        <i data-lucide="eye" class="w-4 h-4 text-blue-500"></i>
        <h3 class="text-sm font-semibold text-gray-700">实时预览</h3>
      </div>

      <div class="glass-card rounded-2xl p-4 space-y-4">
        <div class="flex items-center gap-3">
          <div class="w-12 h-12 rounded-full btn-macaron flex items-center justify-center text-white font-bold text-lg">你</div>
          <div>
            <div class="text-base font-semibold text-gray-800">十四</div>
            <div class="text-xs text-gray-400">有记忆的对话对象</div>
          </div>
        </div>

        <div>
          <div class="text-xs text-gray-400 mb-1">角色描述</div>
          <p class="text-xs text-gray-600 leading-relaxed">安静、温柔，擅长倾听。不会主动追问，但会记住你说过的细节。</p>
        </div>

        <div>
          <div class="text-xs text-gray-400 mb-2">核心锚点</div>
          <div class="flex flex-wrap gap-1.5">
            <span class="tag-pink px-2 py-1 rounded-md text-[10px] font-medium">安静</span>
            <span class="tag-blue px-2 py-1 rounded-md text-[10px] font-medium">倾听</span>
            <span class="tag-green px-2 py-1 rounded-md text-[10px] font-medium">有记忆</span>
          </div>
        </div>

        <div>
          <div class="text-xs text-gray-400 mb-2">性格维度</div>
          <div class="space-y-2">
            <div class="flex items-center gap-2 text-[10px]"><span class="w-12 text-gray-500">温暖</span><div class="flex-1 h-1.5 bg-gray-200 rounded-full overflow-hidden"><div class="h-full bg-pink-400 rounded-full" style="width:75%"></div></div></div>
            <div class="flex items-center gap-2 text-[10px]"><span class="w-12 text-gray-500">活泼</span><div class="flex-1 h-1.5 bg-gray-200 rounded-full overflow-hidden"><div class="h-full bg-blue-400 rounded-full" style="width:35%"></div></div></div>
            <div class="flex items-center gap-2 text-[10px]"><span class="w-12 text-gray-500">独立</span><div class="flex-1 h-1.5 bg-gray-200 rounded-full overflow-hidden"><div class="h-full bg-green-400 rounded-full" style="width:60%"></div></div></div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Create button -->
  <button class="w-full btn-macaron py-3 rounded-xl text-sm font-semibold flex items-center justify-center gap-2">
    <i data-lucide="sparkles" class="w-4 h-4"></i>
    创建角色
  </button>
</div>

<script>
  lucide.createIcons();
</script>
</body>
</html>
