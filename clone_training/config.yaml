# LoRA 微调训练配置
# 用于将特定人的微信聊天风格克隆到模型中

# ── 基础模型 ──
base_model: "Qwen/Qwen2.5-7B-Instruct"
# 可选的国产模型:
#   "Qwen/Qwen2.5-7B-Instruct"      - 通义千问7B (推荐)
#   "deepseek-ai/DeepSeek-R1-Distill-Qwen-7B" - DeepSeek R1蒸馏版
#   "THUDM/chatglm3-6b"             - 清华ChatGLM3
#   "meta-llama/Llama-3.2-3B-Instruct" - Llama 3.2 小模型

# ── LoRA 参数 ──
lora:
  rank: 16                # 秩 (越高越精确，但参数越多)
  alpha: 32               # 缩放系数 (通常 rank*2)
  dropout: 0.05           # 防止过拟合
  target_modules:         # 目标模块 (Qwen默认)
    - q_proj
    - k_proj
    - v_proj
    - o_proj
    - gate_proj
    - up_proj
    - down_proj

# ── 量化 ──
quantization:
  load_in_4bit: true      # 4-bit 量化 (6GB VRAM)
  bnb_4bit_compute_dtype: "float16"
  bnb_4bit_quant_type: "nf4"
  bnb_4bit_use_double_quant: true

# ── 训练超参数 ──
training:
  num_epochs: 3                        # 训练轮数
  per_device_train_batch_size: 4       # 每GPU训练批次
  gradient_accumulation_steps: 4       # 梯度累积 (有效batch=4×4=16)
  learning_rate: 2.0e-4               # 学习率
  warmup_steps: 100                    # 热身步数
  weight_decay: 0.01                   # L2正则
  max_grad_norm: 1.0                   # 梯度裁剪
  lr_scheduler_type: "cosine"          # 学习率调度器
  max_seq_length: 512                  # 最大序列长度
  save_steps: 500                      # 每隔N步保存
  eval_steps: 500                      # 每隔N步验证

# ── 数据配置 ──
data:
  min_messages: 100       # 最小消息数要求
  max_messages: 5000      # 最大使用消息数
  train_ratio: 0.85       # 训练集比例
  augment: true           # 是否增强
  augment_factor: 2       # 增强倍数

# ── 输出 ──
output:
  dir: "./data/lora_output"
  model_name: "girlfriend-clone"
