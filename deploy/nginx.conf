# ═══════════════════════════════════════════════════════════
# 唯一的你 — Nginx Reverse Proxy Configuration
# ═══════════════════════════════════════════════════════════
# Deploy to: /etc/nginx/sites-available/unique-you
# Then: ln -s /etc/nginx/sites-available/unique-you /etc/nginx/sites-enabled/
# Verify: nginx -t
# Reload: nginx -s reload
# ═══════════════════════════════════════════════════════════

upstream ai_girlfriend_backend {
    server 127.0.0.1:8000;
    keepalive 64;
}

upstream unique_you_ws {
    server 127.0.0.1:8765;
    keepalive 64;
}

# ── HTTP → HTTPS Redirect ──
server {
    listen 80;
    server_name 139.199.199.174;
    return 301 https://$server_name$request_uri;
}

# ── HTTPS Server ──
server {
    listen 443 ssl http2;
    server_name 139.199.199.174;

    # ── SSL (managed by certbot) ──
    ssl_certificate     /etc/letsencrypt/live/139.199.199.174/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/139.199.199.174/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # ── Security Headers ──
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self' ws:; frame-ancestors 'none';" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

    # ── Gzip ──
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml
        font/woff
        font/woff2;

    # ── Client Size Limits ──
    client_max_body_size 100M;
    client_body_buffer_size 128k;

    # ── Logging ──
    access_log /var/log/nginx/ai-girlfriend-access.log;
    error_log  /var/log/nginx/ai-girlfriend-error.log;

    # ── Frontend Static Files ──
    root /var/www/ai-girlfriend;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # ── Service Worker (no cache) ──
    location /sw.js {
        add_header Cache-Control "no-cache";
        expires off;
    }

    # ── WeChat Status SSE (must be before /api/ for priority) ──
    location /api/channels/wechat/status-stream {
        proxy_pass http://ai_girlfriend_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-API-Key $http_x_api_key;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
        add_header Cache-Control "no-cache";
        expires off;
    }

    # ── API Reverse Proxy ──
    location /api/ {
        proxy_pass http://ai_girlfriend_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-API-Key $http_x_api_key;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        proxy_buffering off;
    }

    # ── WebSocket Proxy ──
    location /ws {
        proxy_pass http://unique_you_ws;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # ── Deny access to dotfiles ──
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    # ── Deny access to sensitive paths ──
    location ~ (\.env|\.git|config\.yaml|\.pyo?$) {
        deny all;
        access_log off;
        log_not_found off;
    }
}
