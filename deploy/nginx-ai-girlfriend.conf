# ═══════════════════════════════════════════════════════════
# 唯一的你 — Nginx Reverse Proxy Configuration
# ═══════════════════════════════════════════════════════════
# 部署目标: /etc/nginx/conf.d/ai-girlfriend.conf（本机实际路径；
#           原设计注释写的 sites-available 在本机未使用）
# 验证: nginx -t      重载: nginx -s reload
#
# ⚠️ 本模板已于 2026-09-18 与线上配置对齐。
#
# 变更记录：
#   2026-09-18  补齐 HTTP 服务块内的 gzip 与静态强缓存。
#     根因说明：本文件此前的 gzip / Cache-Control / 安全头**全部写在 443 块内**，
#     而线上从未启用 HTTPS（无域名 → certbot 无法为裸 IP 签发证书），
#     于是这些与 TLS 无关的优化**一个都没生效**，首屏 8 个资源以 671KB
#     未压缩传输（压缩后应约 190KB，相差 3.5 倍），且每次访问都要重新协商缓存。
#     教训：**不要把与 TLS 无关的优化放进只在 HTTPS 时才生效的 server 块。**
#
#   ${DOMAIN} 为占位符，由 deploy/setup.sh 通过 envsubst 注入实际域名/IP。
#   HTTP/2 与 HTTPS 见文末「升级路径」——需要先绑定域名。
# ═══════════════════════════════════════════════════════════

server {
    listen 80;
    server_name ${DOMAIN};

    # ================= 传输优化（2026-09-18）=================
    # 实测：首屏 8 资源 675,185 B → 202,402 B（30%），即 660KB → 198KB。
    # ⚠️ text/html 恒被 nginx 压缩，**不可**列入 gzip_types——
    #    显式列出会触发 "duplicate MIME type" 告警。
    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml
        application/wasm;

    # ============ ai-girlfriend Frontend ============
    location / {
        root /opt/ai-girlfriend/frontend/dist;
        try_files $uri $uri/ /index.html;
    }

    # 带 content-hash 的构建产物 → 可安全强缓存 1 年。
    # 此前缺失本段，导致每次访问都要对每个资源发一轮协商请求（多轮 RTT）。
    location ^~ /assets/ {
        root /opt/ai-girlfriend/frontend/dist;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    # index.html 必须每次校验：否则旧 HTML 会引用已被删除的 hash 资源 → 白屏。
    location = /index.html {
        root /opt/ai-girlfriend/frontend/dist;
        add_header Cache-Control "no-cache";
    }

    # 根级图标：中等缓存
    location ~* ^/(favicon\.svg|apple-touch-icon\.png|logo\.png)$ {
        root /opt/ai-girlfriend/frontend/dist;
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
        access_log off;
    }

    # ============ ai-girlfriend API ============
    location /api/ {
        proxy_pass http://127.0.0.1:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        # SSE: 关闭缓冲，确保 token 实时推送
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # ============ ai-girlfriend WebSocket ============
    location /ws/ {
        proxy_pass http://127.0.0.1:8765/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # ============ fastrun SPA（路径前缀路由）============
    location /fastrun {
        proxy_pass http://127.0.0.1:8001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        sub_filter 'src="/assets/' 'src="/fastrun/assets/';
        sub_filter 'href="/assets/' 'href="/fastrun/assets/';
        sub_filter 'baseURL:"/api"' 'baseURL:"/fastrun/api"';
        sub_filter_once off;
        # text/html 是 sub_filter_types 的隐式默认值，重复列出会触发
        # "duplicate MIME type text/html" 告警（2026-09-18 已实测确证：
        #  省略后 text/html 仍被处理，探针改写成功）。
        sub_filter_types application/javascript text/javascript application/x-javascript;
    }

    location /fastrun/ {
        proxy_pass http://127.0.0.1:8001/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        sub_filter 'src="/assets/' 'src="/fastrun/assets/';
        sub_filter 'href="/assets/' 'href="/fastrun/assets/';
        sub_filter 'baseURL:"/api"' 'baseURL:"/fastrun/api"';
        sub_filter_once off;
        sub_filter_types application/javascript text/javascript application/x-javascript;
    }

    # fastrun 静态资源 — JS 内含 baseURL:"/api" 需重写
    location /fastrun/assets/ {
        proxy_pass http://127.0.0.1:8001/assets/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        sub_filter 'baseURL:"/api"' 'baseURL:"/fastrun/api"';
        sub_filter 'src="/assets/' 'src="/fastrun/assets/';
        sub_filter 'href="/assets/' 'href="/fastrun/assets/';
        sub_filter_once off;
        sub_filter_types application/javascript text/javascript application/x-javascript application/json;
        # 禁用上游压缩，确保 sub_filter 可处理响应体
        proxy_set_header Accept-Encoding "";
    }

    # fastrun API
    location /fastrun/api/ {
        proxy_pass http://127.0.0.1:8001/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 300s;
        proxy_buffering off;
        proxy_cache off;
    }

    # ============ 家书 letter-0807 ============
    location /letter-0807/ {
        alias /opt/letter-0807/;
        index index.html;
        try_files $uri $uri/ /letter-0807/index.html;
    }

    # directus 管理后台反代
    location /directus/ {
        proxy_pass http://127.0.0.1:18083/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
    location = /directus { return 301 /directus/; }
}

# ═══════════════════════════════════════════════════════════
# 升级路径：绑定域名后启用 HTTPS + HTTP/2
# ═══════════════════════════════════════════════════════════
# 为什么现在开不了（2026-09-18 实测确认的前提缺失）：
#   1. certbot / Let's Encrypt **无法为裸 IP**（139.199.199.174）签发公信证书
#      → 必须先有域名并解析到本机；
#   2. **浏览器不支持明文 HTTP/2（h2c）** → HTTP/2 必须跑在 TLS 之上；
#   3. 现状：无域名、无证书、未监听 443。
#   结论：HTTP/2 不是"没开"，而是**被 HTTPS 前提卡住**，与 gzip/缓存不同
#         （后两者与 TLS 无关，已在上面 HTTP 块内生效）。
#
# 步骤：
#   a. 域名 A 记录指向 139.199.199.174
#   b. sudo certbot --nginx -d <your-domain>
#      certbot 会自动写入 ssl_certificate / ssl_certificate_key，
#      并把 80 块改为 301 跳转，无需手写 SSL 配置
#   c. 在 certbot 生成/改造的 443 块上补 `http2` 与本文件末尾的安全头
#
# ── 可选加固（HTTPS 就绪后再启用）──
# ⚠️ HSTS 严禁在纯 HTTP 下开启：浏览器会强制升级 HTTPS，
#    而站点无 HTTPS → 直接导致站点不可访问。
#
# add_header X-Frame-Options "SAMEORIGIN" always;
# add_header X-Content-Type-Options "nosniff" always;
# add_header Referrer-Policy "strict-origin-when-cross-origin" always;
# add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
# add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
# CSP 涉及全部外部依赖白名单（字体 / CDN / ws），配错会白屏或静默失效，
# 建议单独开窗口逐项验证后再上线，勿随其他改动一起推。
