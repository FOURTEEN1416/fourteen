# ═══════════════════════════════════════════════════════════
# 唯一的你 — Nginx Reverse Proxy Configuration
# ═══════════════════════════════════════════════════════════
# Deploy to: /etc/nginx/sites-available/unique-you
# Then: ln -s /etc/nginx/sites-available/unique-you /etc/nginx/sites-enabled/
# Verify: nginx -t
# Reload: nginx -s reload
#
# NOTE:
#   - ${DOMAIN} 为占位符，由 deploy/setup.sh 通过 envsubst 注入实际域名/IP。
#   - SSL 暂未配置：certbot 无法为裸 IP 地址签发证书，需绑定域名后才能启用
#     HTTPS。当前使用 HTTP 正常对外服务。待绑定域名后运行：
#       sudo certbot --nginx -d ${DOMAIN}
#     certbot 会自动写入 ssl_certificate / ssl_certificate_key 并添加 HTTP→HTTPS
#     重定向，无需手动维护 SSL 配置。
# ═══════════════════════════════════════════════════════════

# ── 速率限制（需在 http 上下文，sites-enabled 文件被 include 在 http 块内）──
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;

upstream ai_girlfriend_backend {
    server 127.0.0.1:8000;
    keepalive 64;
}

upstream unique_you_ws {
    server 127.0.0.1:8765;
    keepalive 64;
}

# ── HTTP → HTTPS 重定向 ──
server {
    listen 80;
    server_name _;
    return 301 https://$host$request_uri;
}

# ── HTTPS Server（SSL 通过 certbot 自动配置后启用）──
server {
    listen 443 ssl http2;
    server_name _;

    # SSL 配置（部署时通过 certbot 自动配置）
    # ssl_certificate /etc/letsencrypt/live/<domain>/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/<domain>/privkey.pem;
    # ssl_protocols TLSv1.2 TLSv1.3;
    # ssl_ciphers HIGH:!aNULL:!MD5;

    # ── 安全头 ──
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self' ws: wss:; media-src 'self' blob:;" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # ── 速率限制 ──
    limit_req zone=api_limit burst=20 nodelay;

    # ── Gzip ──
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml
        font/woff
        font/woff2;

    # ── Client Size Limits ──
    client_max_body_size 10M;
    client_body_buffer_size 128k;

    # ── Logging ──
    access_log /var/log/nginx/ai-girlfriend-access.log;
    error_log  /var/log/nginx/ai-girlfriend-error.log;

    # ── Frontend Static Files ──
    # 路径与 deploy/deploy.sh 的部署目标保持一致
    root /opt/ai-girlfriend/frontend/dist;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # ── Service Worker (no cache) ──
    location /sw.js {
        add_header Cache-Control "no-cache";
        expires off;
    }

    # ── WeChat Status SSE (must be before /api/ for priority) ──
    location /api/channels/wechat/status-stream {
        proxy_pass http://ai_girlfriend_backend/api/channels/wechat/status-stream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-API-Key $http_x_api_key;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
        add_header Cache-Control "no-cache";
        expires off;
    }

    # ── API Reverse Proxy ──
    location /api/ {
        proxy_pass http://ai_girlfriend_backend/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-API-Key $http_x_api_key;
        # SSE 流式响应：关闭缓冲，确保 token 实时推送
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # ── WebSocket Proxy ──
    location /ws/ {
        proxy_pass http://unique_you_ws/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # ── Deny access to dotfiles ──
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    # ── Deny access to sensitive paths ──
    location ~ (\.env|\.git|config\.yaml|\.pyo?$) {
        deny all;
        access_log off;
        log_not_found off;
    }
}
