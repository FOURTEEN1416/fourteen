server {
    listen 80;
    server_name 139.199.199.174;

    # ============ ai-girlfriend Frontend ============
    location / {
        root /opt/ai-girlfriend/frontend/dist;
        try_files $uri $uri/ /index.html;
    }

    # ============ ai-girlfriend API ============
    location /api/ {
        proxy_pass http://127.0.0.1:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        # SSE: 关闭缓冲，确保 token 实时推送
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # ============ ai-girlfriend WebSocket ============
    location /ws/ {
        proxy_pass http://127.0.0.1:8765/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # ============ fastrun SPA (path-based routing) ============
    # 主页面 — 重写绝对路径到 /fastrun/ 前缀
    location /fastrun {
        proxy_pass http://127.0.0.1:8001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 重写 HTML/JS 中的绝对路径
        sub_filter 'src="/assets/' 'src="/fastrun/assets/';
        sub_filter 'href="/assets/' 'href="/fastrun/assets/';
        sub_filter 'baseURL:"/api"' 'baseURL:"/fastrun/api"';
        sub_filter_once off;
        sub_filter_types text/html application/javascript text/javascript application/x-javascript;
    }

    location /fastrun/ {
        proxy_pass http://127.0.0.1:8001/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        sub_filter 'src="/assets/' 'src="/fastrun/assets/';
        sub_filter 'href="/assets/' 'href="/fastrun/assets/';
        sub_filter 'baseURL:"/api"' 'baseURL:"/fastrun/api"';
        sub_filter_once off;
        sub_filter_types text/html application/javascript text/javascript application/x-javascript;
    }

    # fastrun 静态资源 — JS 中包含 baseURL:"/api" 需要重写
    location /fastrun/assets/ {
        proxy_pass http://127.0.0.1:8001/assets/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        sub_filter 'baseURL:"/api"' 'baseURL:"/fastrun/api"';
        sub_filter 'src="/assets/' 'src="/fastrun/assets/';
        sub_filter 'href="/assets/' 'href="/fastrun/assets/';
        sub_filter_once off;
        sub_filter_types application/javascript text/javascript application/x-javascript application/json;
        # 禁用上游压缩，确保 sub_filter 可处理
        proxy_set_header Accept-Encoding "";
    }

    # fastrun API
    location /fastrun/api/ {
        proxy_pass http://127.0.0.1:8001/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 300s;
        proxy_buffering off;
        proxy_cache off;
    }
}
