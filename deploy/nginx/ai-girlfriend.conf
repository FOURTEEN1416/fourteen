server {
    listen 80;
    # SECURITY（审查 F-high-3）：公开仓模板勿写死生产 IP/域名。
    # 部署时替换为你的公网 IP 或域名（可用 envsubst / 手工编辑）。
    server_name YOUR_SERVER_IP;

    # ============ 安全响应头（P0 修复批 2026-10-04）============
    # 与 TLS 无关的三条基线安全头，直接放 HTTP 块生效（站点未启用 HTTPS 时也有效）；
    # ⚠️ HSTS 严禁在纯 HTTP 下开启（浏览器会强制升级到不存在的 HTTPS → 站点不可达）。
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # ============ ai-girlfriend Frontend ============
    location / {
        root /opt/ai-girlfriend/frontend/dist;
        try_files $uri $uri/ /index.html;
    }

    # ============ ai-girlfriend API ============
    location /api/ {
        proxy_pass http://127.0.0.1:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # SECURITY（auth-bruteforce 修复批 2026-10-09）：覆盖写 $remote_addr，
        # 丢弃客户端自带的伪造 X-Forwarded-For 链（旧追加语义会把伪造头保留在
        # 最前，应用层防爆破限速键会被绕过）。
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        # SSE: 关闭缓冲，确保 token 实时推送
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # ============ ai-girlfriend WebSocket ============
    location /ws/ {
        proxy_pass http://127.0.0.1:8765/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        # 长连接每帧都会写访问日志，且无分析价值 → 关闭，防日志膨胀（P0 修复批）
        access_log off;
    }

    # ============ fastrun SPA (path-based routing) ============
    # 主页面 — 重写绝对路径到 /fastrun/ 前缀
    location /fastrun {
        proxy_pass http://127.0.0.1:8001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # SECURITY（auth-bruteforce 修复批 2026-10-09）：覆盖写 $remote_addr，
        # 丢弃客户端自带的伪造 X-Forwarded-For 链（旧追加语义会把伪造头保留在
        # 最前，应用层防爆破限速键会被绕过）。
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 重写 HTML/JS 中的绝对路径
        sub_filter 'src="/assets/' 'src="/fastrun/assets/';
        sub_filter 'href="/assets/' 'href="/fastrun/assets/';
        sub_filter 'baseURL:"/api"' 'baseURL:"/fastrun/api"';
        sub_filter_once off;
        sub_filter_types text/html application/javascript text/javascript application/x-javascript;
    }

    location /fastrun/ {
        proxy_pass http://127.0.0.1:8001/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # SECURITY（auth-bruteforce 修复批 2026-10-09）：覆盖写 $remote_addr，
        # 丢弃客户端自带的伪造 X-Forwarded-For 链（旧追加语义会把伪造头保留在
        # 最前，应用层防爆破限速键会被绕过）。
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;

        sub_filter 'src="/assets/' 'src="/fastrun/assets/';
        sub_filter 'href="/assets/' 'href="/fastrun/assets/';
        sub_filter 'baseURL:"/api"' 'baseURL:"/fastrun/api"';
        sub_filter_once off;
        sub_filter_types text/html application/javascript text/javascript application/x-javascript;
    }

    # fastrun 静态资源 — JS 中包含 baseURL:"/api" 需要重写
    location /fastrun/assets/ {
        proxy_pass http://127.0.0.1:8001/assets/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # SECURITY（auth-bruteforce 修复批 2026-10-09）：覆盖写 $remote_addr，
        # 丢弃客户端自带的伪造 X-Forwarded-For 链（旧追加语义会把伪造头保留在
        # 最前，应用层防爆破限速键会被绕过）。
        proxy_set_header X-Forwarded-For $remote_addr;

        sub_filter 'baseURL:"/api"' 'baseURL:"/fastrun/api"';
        sub_filter 'src="/assets/' 'src="/fastrun/assets/';
        sub_filter 'href="/assets/' 'href="/fastrun/assets/';
        sub_filter_once off;
        sub_filter_types application/javascript text/javascript application/x-javascript application/json;
        # 禁用上游压缩，确保 sub_filter 可处理
        proxy_set_header Accept-Encoding "";
    }

    # fastrun API
    location /fastrun/api/ {
        proxy_pass http://127.0.0.1:8001/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # SECURITY（auth-bruteforce 修复批 2026-10-09）：覆盖写 $remote_addr，
        # 丢弃客户端自带的伪造 X-Forwarded-For 链（旧追加语义会把伪造头保留在
        # 最前，应用层防爆破限速键会被绕过）。
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 300s;
        proxy_buffering off;
        proxy_cache off;
    }
}
